name: spaces
description: "An Interior Design Agent"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.1.0
  iconsax_plus: ^1.0.0
  camera: ^0.10.5+9
  permission_handler: ^10.4.5
  image_picker: ^1.0.7
  logger: ^2.0.2+1
  http: ^1.1.0
  uuid: ^4.3.3
  video_player: ^2.9.1
  flutter_avif: ^2.2.0
  # ar_flutter_plugin: ^0.7.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

  
  uses-material-design: true

  # images and logo
  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/improvements/
    - assets/images/choose_style/
    - assets/images/extras/
    - assets/images/choose_space/
    - assets/images_for_choose_spaces_new/
    - assets/logo/
    - assets/animations/analyzing/

  # fonts
  fonts:
    - family: AnnieUseYourTelescope
      fonts:
        - asset: assets/fonts/AnnieUseYourTelescope-Regular.ttf
    - family: Kristi
      fonts:
        - asset: assets/fonts/Kristi-Regular.ttf
    - family: SF Pro Rounded
      fonts:
        - asset: assets/fonts/SF Pro/SF-Pro-Rounded-Ultralight.otf
          weight: 100
        - asset: assets/fonts/SF Pro/SF-Pro-Rounded-Thin.otf
          weight: 200
        - asset: assets/fonts/SF Pro/SF-Pro-Rounded-Light.otf
          weight: 300
        - asset: assets/fonts/SF Pro/SF-Pro-Rounded-Regular.otf
          weight: 400
        - asset: assets/fonts/SF Pro/SF-Pro-Rounded-Medium.otf
          weight: 500
        - asset: assets/fonts/SF Pro/SF-Pro-Rounded-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF Pro/SF-Pro-Rounded-Bold.otf
          weight: 700
        - asset: assets/fonts/SF Pro/SF-Pro-Rounded-Heavy.otf
          weight: 800
        - asset: assets/fonts/SF Pro/SF-Pro-Rounded-Black.otf
          weight: 900
